<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Store</title><style>
:root{--ink:#17202a;--muted:#64707d;--line:#e5e9ee;--brand:#175cd3;--soft:#f6f8fb}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fff}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;background:#fff;z-index:2}.logo{font-weight:800;font-size:21px;letter-spacing:-.5px}.logo span{color:var(--brand)}nav{display:flex;gap:25px;align-items:center}a{color:inherit;text-decoration:none}nav a{color:#56616e}nav a:hover{color:var(--brand)}.cart-link{border:1px solid var(--line);padding:9px 14px;border-radius:8px}.count{background:var(--brand);color:#fff;border-radius:10px;padding:2px 7px;font-size:12px;margin-left:5px}.wrap{max-width:1120px;margin:auto;padding:48px 6%}.eyebrow{text-transform:uppercase;color:var(--brand);letter-spacing:1.5px;font-size:12px;font-weight:700}.hero{padding:38px 0 28px}.hero h1{font-size:42px;letter-spacing:-1px;margin:10px 0}.hero p{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:.15s}.card:hover{box-shadow:0 8px 24px #182b4514;transform:translateY(-2px)}.pic{height:170px;background:linear-gradient(135deg,#eef3fb,#f8fafc);display:flex;align-items:center;justify-content:center;font-size:48px}.card-body{padding:16px}.category{font-size:12px;color:var(--muted)}h2,h3{margin:6px 0}.price{font-weight:700;font-size:18px;margin:12px 0}.btn{border:0;border-radius:7px;background:var(--brand);color:#fff;padding:11px 15px;font-weight:650;cursor:pointer}.btn.secondary{background:#eef3fb;color:#17428e}.btn.full{width:100%}.detail{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.detail .pic{height:350px;border-radius:14px;font-size:100px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:12px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:18px}.panel{max-width:720px;border:1px solid var(--line);border-radius:12px;padding:26px}.total{font-size:20px;font-weight:750;display:flex;justify-content:space-between;margin-top:22px}.form{max-width:420px;margin:40px auto}.form input{display:block;width:100%;padding:12px;border:1px solid #ccd3db;border-radius:7px;margin:7px 0 18px}.notice{background:#f0f6ff;padding:14px;border-radius:8px;color:#234d93;margin:18px 0}@media(max-width:700px){.detail{grid-template-columns:1fr}nav{gap:10px}.hero h1{font-size:34px}}
</style></head><body><header><a class="logo" href="#/products">Demo<span>Store</span></a><nav><a href="#/products">Shop</a><a href="#/cart" class="cart-link">Cart <span class="count" id="cart-count">0</span></a></nav></header><main id="app"></main><script>
const icons={headphones:'🎧',keyboard:'⌨️',mouse:'🖱️',hub:'🔌',stand:'💻',watch:'⌚',speaker:'🔊',webcam:'📷'};let products=[];const money=n=>'₹'+n.toLocaleString('en-IN');
async function api(url,opt){let r=await fetch(url,opt);return r.json()} async function refreshCount(){let c=await api('/api/cart');document.querySelector('#cart-count').textContent=c.items.reduce((a,x)=>a+x.quantity,0)}
function layout(x){document.querySelector('#app').innerHTML='<div class="wrap">'+x+'</div>';refreshCount()}
async function productsPage(){products=await api('/api/products');layout('<div class="hero"><div class="eyebrow">Thoughtfully selected tech</div><h1>Everyday tools, made better.</h1><p>Reliable gear for work, play and everything in between.</p></div><div class="grid">'+products.map(p=>`<article class="card"><a href="#/product/${p.id}"><div class="pic">${icons[p.id]}</div><div class="card-body"><div class="category">${p.category}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div></div></a></article>`).join('')+'</div>')}
async function productPage(id){let p=await api('/api/products/'+id);layout(`<div class="detail"><div class="pic">${icons[p.id]}</div><div><div class="category">${p.category}</div><h1>${p.name}</h1><p class="muted">${p.description}</p><div class="price">${money(p.price)}</div><button class="btn" data-testid="add-to-cart" onclick="add('${p.id}')">Add to cart</button></div></div>`)}
async function add(id){await api('/api/cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id})});location.hash='/cart'}
async function cartPage(){let c=await api('/api/cart');layout(`<h1>Your cart</h1>${c.items.length?'<div class="panel">'+c.items.map(x=>`<div class="row" data-testid="cart-item"><div><b>${x.name}</b><div class="muted">${money(x.price)} each</div></div><div class="qty"><button data-testid="quantity-decrease" onclick="change('${x.id}',${x.quantity-1})">−</button><span>${x.quantity}</span><button data-testid="quantity-increase" onclick="change('${x.id}',${x.quantity+1})">+</button></div><b>${money(x.lineTotal)}</b></div>`).join('')+`<div class="total"><span>Total</span><span data-testid="cart-total">${money(c.total)}</span></div><a class="btn full" style="display:block;text-align:center;margin-top:20px" data-testid="checkout-button" href="#/checkout">Proceed to checkout</a></div>`:'<p class="muted">Your cart is empty.</p>'}`)}
async function change(id,q){await api('/api/cart/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantity:q})});cartPage()}
async function checkoutPage(){let c=await api('/api/checkout');layout(`<h1>Checkout</h1><div class="panel"><div class="notice">Secure checkout · Free delivery on every order</div><h3>Order summary</h3>${c.items.map(x=>`<div class="row"><span>${x.name} × ${x.quantity}</span><b>${money(x.lineTotal)}</b></div>`).join('')}<div class="total"><span>Total to pay</span><span data-testid="checkout-total">${money(c.total)}</span></div><button class="btn full" style="margin-top:24px" onclick="finish()">Place order</button></div>`)}
function finish(){location.hash='/order-success'} function login(){layout('<div class="form"><div class="eyebrow">Welcome back</div><h1>Sign in to Demo Store</h1><p class="muted">Use the demo account to continue.</p><label>Email<input id="email" value="demo@breakpoint.local" type="email"></label><label>Password<input id="password" value="demo123" type="password"></label><button class="btn full" onclick="location.hash=\'#/products\'">Sign in</button></div>')} function success(){layout('<div style="text-align:center;padding:80px 0"><div style="font-size:55px">✓</div><h1>Order placed</h1><p class="muted">Thanks for shopping with Demo Store.</p><a class="btn" href="#/products">Continue shopping</a></div>')}
function route(){let p=location.hash.slice(1)||'/login';if(p==='/login')login();else if(p==='/products')productsPage();else if(p==='/cart')cartPage();else if(p==='/checkout')checkoutPage();else if(p==='/order-success')success();else if(p.startsWith('/product/'))productPage(p.split('/')[2])}addEventListener('hashchange',route);route();
</script></body></html>
